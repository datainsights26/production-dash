<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<title>Production</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Production">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root { color-scheme: dark; --bg:#0a0a0b; --panel:#141416; --line:#2a2a2e; --text:#f0f0f2; --muted:#9a9aa2; --accent:#46c47e; --bad:#e25454; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
#lock { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; }
.card { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 24px; box-sizing:border-box; text-align:center; }
.card img { width:72px; height:72px; border-radius:16px; }
h1 { font-size:20px; font-weight:600; margin:14px 0 4px; }
p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
input[type=password] { width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:17px; letter-spacing:.06em; text-align:center; }
input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; }
label.rem { display:flex; gap:8px; align-items:center; justify-content:center; margin:14px 0 18px; color:var(--muted); font-size:14px; }
button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#06140c; font-size:16px; font-weight:600; cursor:pointer; }
button[disabled] { opacity:.6; cursor:progress; }
#msg { min-height:20px; margin-top:12px; font-size:14px; color:var(--bad); }
#app { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
</style>
</head>
<body>
<div id="lock">
  <form class="card" id="f" autocomplete="on">
    <img src="icons/icon-192.png" alt="">
    <h1>Production dashboard</h1>
    <p class="sub">Enter the password to open it.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <button id="go" type="submit">Open</button>
    <div id="msg" role="alert"></div>
  </form>
</div>
<iframe id="app" title="Production dashboard"></iframe>

const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = 'pd-key-v1';
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openWith(k) {
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, k, u8(P.ct));
  const f = document.getElementById('app');
  f.srcdoc = new TextDecoder().decode(pt);
  f.style.display = 'block'; document.getElementById('lock').style.display = 'none';
}
(async () => {
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try { const k = await crypto.subtle.importKey('raw', u8(raw), 'AES-GCM', false, ['decrypt']); await openWith(k); return; }
    catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
  }
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  go.disabled = true; go.textContent = 'Opening…'; msg.textContent = '';
  try {
    const k = await derive(document.getElementById('pw').value.trim().toUpperCase());
    await openWith(k);
    if (document.getElementById('rem').checked) {
      try { const r = new Uint8Array(await crypto.subtle.exportKey('raw', k)); localStorage.setItem(KEY, btoa(String.fromCharCode(...r))); } catch (e) {}
    }
  } catch (e) { msg.textContent = 'That password is not right. Check it and try again.'; }
  go.disabled = false; go.textContent = 'Open';
});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
